name: Continuous Earning Research

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Discover new online work
        run: node scripts/continuous-research.mjs
      - name: Commit refreshed opportunity feed
        run: |
          git config user.name "earning-manager-research"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunities.json
          git diff --cached --quiet || git commit -m "Refresh continuous earning research feed"
          git push
